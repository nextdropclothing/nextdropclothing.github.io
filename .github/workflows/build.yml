# Rebuilds and republishes the website every time something changes on the "source" branch
# (e.g. a product added in Pages CMS). The finished site is pushed to "main", which GitHub Pages serves.
name: Build website
on:
  push:
    branches: [source]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
        env:
          TARGET: pages
          URL: https://nextdropclothing.github.io
      - name: Publish to main
        run: |
          cd dist
          git init -q -b main
          git config user.name "nextdrop-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish website (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
